spring.application.name=awscloud

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/awsdemo}
spring.datasource.username=${DB_USER:deepak}
spring.datasource.password=${DB_PASSWORD:test123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY:env}
aws.secret-key=${AWS_SECRET_KEY:env}
aws.s3.bucket=${AWS_S3_BUCKET:env}
aws.lambda.function-name=${AWS_LAMBDA_FUNCTION:env}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
