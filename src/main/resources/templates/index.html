<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Services Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6">

<header class="mb-8 text-center">
    <h1 class="text-3xl font-bold tracking-tight">AWS Services Demo</h1>
    <p class="text-gray-400 mt-1 text-sm">EC2 &middot; S3 &middot; RDS &middot; Lambda</p>
</header>

<main class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-5xl mx-auto">

    <!-- EC2 Card -->
    <div class="card">
        <div class="card-header">
            <span class="dot bg-orange-400"></span>
            <h2 class="card-title">EC2 &mdash; Hello from EC2</h2>
        </div>
        <div id="ec2-content" class="text-gray-400 text-sm">Loading&hellip;</div>
    </div>

    <!-- S3 Card -->
    <div class="card">
        <div class="card-header">
            <span class="dot bg-green-400"></span>
            <h2 class="card-title">S3 &mdash; Image Gallery</h2>
        </div>
        <div class="flex gap-2 mb-3">
            <input type="file" id="s3-file" accept="image/*"
                   class="flex-1 text-sm text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-gray-600 file:text-white hover:file:bg-gray-500 cursor-pointer">
            <button onclick="s3Upload()" class="btn btn-green">Upload</button>
        </div>
        <div id="s3-status" class="text-xs text-gray-500 mb-3 min-h-[1rem]"></div>
        <div id="s3-gallery" class="grid grid-cols-3 gap-2">
            <p class="text-gray-500 text-sm col-span-3">Loading gallery&hellip;</p>
        </div>
    </div>

    <!-- RDS Card -->
    <div class="card">
        <div class="card-header">
            <span class="dot bg-blue-400"></span>
            <h2 class="card-title">RDS &mdash; Visitor Notes</h2>
        </div>
        <div class="flex gap-2 mb-3">
            <input type="text" id="note-input" placeholder="Enter a note&hellip;"
                   class="input flex-1"
                   onkeydown="if(event.key==='Enter') noteSubmit()">
            <button onclick="noteSubmit()" class="btn btn-blue">Submit</button>
        </div>
        <div id="notes-status" class="text-xs text-gray-500 mb-3 min-h-[1rem]"></div>
        <div id="notes-table" class="overflow-auto max-h-56">
            <p class="text-gray-500 text-sm">Loading notes&hellip;</p>
        </div>
    </div>

    <!-- Lambda Card -->
    <div class="card">
        <div class="card-header">
            <span class="dot bg-purple-400"></span>
            <h2 class="card-title">Lambda &mdash; Number Doubler</h2>
        </div>
        <div class="flex gap-2 mb-3">
            <input type="number" id="lambda-input" placeholder="Enter a number&hellip;" value="21"
                   class="input flex-1"
                   onkeydown="if(event.key==='Enter') lambdaDouble()">
            <button onclick="lambdaDouble()" class="btn btn-purple">Send to Lambda</button>
        </div>
        <div id="lambda-result" class="text-sm text-gray-400 min-h-[2rem]"></div>
    </div>

</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
